name: Windows package

# Builds DemonX-<version>-windows-x64.zip (DemonX, its own Node, start files, guide).
# Run it by hand (Actions tab, "Run workflow") to get the zip as a download, or push a tag like v2.0.0-test1 to also
# attach it to a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: The tag must match the version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/build-windows.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: DemonX-windows-x64
          path: dist-windows/DemonX-*-windows-x64.zip
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-windows/DemonX-*-windows-x64.zip
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: docs/releases/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
