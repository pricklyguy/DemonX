board: Dobermann S3
name: DemonX

verbose_errors: false

stepping:
  engine: I2S_STATIC
  idle_ms: 255
  pulse_us: 4
  dir_delay_us: 0
  disable_delay_us: 0

i2so:
  bck_pin: gpio.16
  data_pin: gpio.17
  ws_pin: gpio.18


# Home Assistant Pendant UART
uart1:
  txd_pin: gpio.13
  rxd_pin: gpio.14
  baud: 115200
  mode: 8N1

uart_channel1:
  report_interval_ms: 75
  uart_num: 1
# End HA UART port set up.

axes:
  shared_stepper_disable_pin: NO_PIN
  x:
    steps_per_mm: 133.734
    max_rate_mm_per_min: 20000.000
    acceleration_mm_per_sec2: 800.000
    max_travel_mm: 1219.000
    soft_limits: false
    homing:
      cycle: 2
      positive_direction: false
      mpos_mm: 10
      feed_mm_per_min: 200.000
      seek_mm_per_min: 2000.000
      settle_ms: 500
      seek_scaler: 1.3
      feed_scaler: 1.3

    motor0:
      limit_neg_pin: gpio.42:low:pu
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 10
      standard_stepper:
        step_pin: I2SO.3
        direction_pin: I2SO.4
        disable_pin: I2SO.5

  
  y:
    steps_per_mm: 133.886
    max_rate_mm_per_min: 9000.000
    acceleration_mm_per_sec2: 400.000
    max_travel_mm: 1310.000
    soft_limits: false
    homing:
      cycle: 3
      positive_direction: false
      mpos_mm: 10
      feed_mm_per_min: 200.000
      seek_mm_per_min: 2000.000
      settle_ms: 500
      seek_scaler: 1.3
      feed_scaler: 1.3

    motor0:
      limit_neg_pin: gpio.41:low:pu
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 10
      standard_stepper:
        step_pin: I2SO.0
        direction_pin: I2SO.1:low
        disable_pin: I2SO.2

    motor1:
      limit_neg_pin: gpio.39:low:pu
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 10
      standard_stepper:
        step_pin: I2SO.9
        direction_pin: I2SO.10:low
        disable_pin: I2SO.11


  z:
    steps_per_mm: 200.236
    max_rate_mm_per_min: 4000.000
    acceleration_mm_per_sec2: 200.000
    max_travel_mm: 175.000
    soft_limits: false
    homing:
      cycle: 1
      positive_direction: true
      mpos_mm: -3  
      feed_mm_per_min: 125.000
      seek_mm_per_min: 2000.000
      settle_ms: 500
      seek_scaler: 1.2
      feed_scaler: 1.2  

    motor0:
      limit_neg_pin: NO_PIN
      limit_pos_pin: gpio.40:low:pu
      limit_all_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 3.0
      standard_stepper:
        step_pin: I2SO.6
        direction_pin: I2SO.7:low
        disable_pin: I2SO.8

parking:
  enable: true
  axis: Z
  pullout_distance_mm: 5.000
  pullout_rate_mm_per_min: 250.000
  target_mpos_mm: -5.000
  rate_mm_per_min: 800.000

spi:
  miso_pin: gpio.2
  mosi_pin: gpio.1
  sck_pin: gpio.21

sdcard:
  card_detect_pin: NO_PIN
  cs_pin: gpio.9
  frequency_hz: 400000

probe:
  pin: gpio.38:low
  toolsetter_pin: NO_PIN
  check_mode_start: true
  hard_stop: false

control:
  safety_door_pin: gpio.37:low
  reset_pin: NO_PIN
  feed_hold_pin: gpio.36:low
  cycle_start_pin: gpio.48:low

coolant:
  mist_pin: gpio.46
  delay_ms: 800

user_outputs:
  digital0_pin: NO_PIN
  digital1_pin: NO_PIN

10V:
  output_pin: gpio.6
  forward_pin: gpio.7
  reverse_pin: NO_PIN
  pwm_hz: 5000
  enable_pin: NO_PIN
  direction_pin: NO_PIN
  disable_with_s0: false
  s0_with_disable: true
  spinup_ms: 2000
  spindown_ms: 0
  tool_num: 0
  speed_map: 0=0.000% 1000=0.000% 24000=100.000%
  off_on_alarm: false

## Start RS485
# uart1:
  # txd_pin: gpio.12
  # rxd_pin: gpio.11
  # rts_pin: NO_PIN
  # baud: 9600
  # mode: 8N1
## End RS485

start:
  must_home: true
  deactivate_parking: false
  check_limits: false